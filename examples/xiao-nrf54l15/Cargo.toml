[package]
edition = "2024"
name = "xiao-nrf54l15-examples"
rust-version = "1.88"
version = "0.1.0"
publish = false

[dependencies]
# The blocking examples use this in blocking mode: no executor, no time driver,
# no `async`. They only need it to acquire the peripheral singletons they hand
# to the BSP. The `async` feature below also turns on its GRTC time driver, for
# the `_async` examples.
embassy-nrf = { version = "0.11.0", features = ["nrf54l15-app-s"] }

# The `async` runtime. It lives here, in the application, not in the BSP: the
# BSP's `async` feature is a pure code gate and starts nothing. `embassy-time`
# supplies the `_async` examples' delay, backed by the GRTC driver the `async`
# feature turns on in `embassy-nrf`.
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
], optional = true }
embassy-time = { version = "0.5.1", optional = true }

cortex-m-rt = "0.7.5"

# The console. The nRF54L15 has no USB peripheral, so the only way off the chip
# is RTT over the onboard debugger, which `cargo run` attaches to. See the
# README. `panic-rtt-target` is `rtt-target`'s own panic handler: it prints the
# panic message and location down the same channel, with its `defmt` feature
# left off so nothing here depends on `defmt`.
rtt-target = "0.6.2"
panic-rtt-target = "0.2.0"

embedded-hal = "1.0.0"

uferris-bsp = { path = "../..", features = ["xiao-nrf54l15"] }

# The demo bodies, shared by every board's examples.
uferris-demos = { path = "../uferris-demos" }


[[bin]]
name = "blinky"
path = "src/bin/blinky.rs"


[[bin]]
name = "baseboard_demo"
path = "src/bin/baseboard_demo.rs"

[[bin]]
name = "full_board_demo"
path = "src/bin/full_board_demo.rs"
required-features = ["power-board"]

[[bin]]
name = "blinky_async"
path = "src/bin/blinky_async.rs"
required-features = ["async"]

[[bin]]
name = "baseboard_demo_async"
path = "src/bin/baseboard_demo_async.rs"
required-features = ["async"]


[features]
power-board = ["uferris-bsp/power-board", "uferris-demos/power-board"]

async = [
    "uferris-bsp/async",
    "uferris-demos/async",
    "dep:embassy-executor",
    "dep:embassy-time",
    "embassy-nrf/time-driver-grtc",
]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
