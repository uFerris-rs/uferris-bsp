[package]
edition = "2024"
name = "xiao-esp32c6-examples"
rust-version = "1.95"
version = "0.1.0"
publish = false

[dependencies]
esp-hal = { version = "~1.2", features = ["esp32c6", "unstable"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }

esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c6"] }

critical-section = "1.2.0"
static_cell = "2.1.1"

# The `async` runtime. It lives here, in the application, not in the BSP: the
# BSP's `async` feature is a pure code gate and starts nothing. `esp-rtos` is
# the scheduler `uferris_init_async` hands its `EspRtosParts` back for, and its
# `embassy` feature is what supplies `#[esp_rtos::main]` and the time queue
# behind `embassy-time`.
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp32c6",
], optional = true }

# No `arch-*` feature here: `esp-rtos` provides the executor these examples run
# on, and enabling one on `embassy-executor` would install a second one.
embassy-executor = { version = "0.10.0", features = [], optional = true }
embassy-time = { version = "0.5.1", optional = true }

uferris-bsp = { path = "../..", features = ["xiao-esp32c6"] }

# The demo bodies, shared by every board's examples.
uferris-demos = { path = "../uferris-demos" }


[[bin]]
name = "blinky"
path = "src/bin/blinky.rs"


[[bin]]
name = "baseboard_demo"
path = "src/bin/baseboard_demo.rs"

[[bin]]
name = "full_board_demo"
path = "src/bin/full_board_demo.rs"
required-features = ["power-board"]

[[bin]]
name = "blinky_async"
path = "src/bin/blinky_async.rs"
required-features = ["async"]

[[bin]]
name = "baseboard_demo_async"
path = "src/bin/baseboard_demo_async.rs"
required-features = ["async"]


[features]
power-board = ["uferris-bsp/power-board", "uferris-demos/power-board"]

async = [
    "uferris-bsp/async",
    "uferris-demos/async",
    "dep:esp-rtos",
    "dep:embassy-executor",
    "dep:embassy-time",
]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
