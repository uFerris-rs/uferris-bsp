[target.thumbv8m.main-none-eabihf]
# Converts the ELF to UF2 and copies it onto a Xiao RP2350 in bootloader mode.
# `elf2uf2-rs` does not support the RP2350, so the runner is `uf2deploy`
# (`cargo install uf2deploy`), the same tool the Xiao nRF52840 example uses.
runner = "uf2deploy deploy --family rp2350_arm_s --path auto"

[env]

[build]
rustflags = [
  # Keep the flash image compact: do not page-align sections.
  "-C",
  "link-arg=--nmagic",
  # The cortex-m-rt linker script.
  "-C",
  "link-arg=-Tlink.x",
  # The RP2350 Arm core.
  "-C",
  "target-cpu=cortex-m33",
]

target = "thumbv8m.main-none-eabihf"
