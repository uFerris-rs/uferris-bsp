[target.thumbv6m-none-eabi]
# Converts the ELF to a UF2 and deploys it to a Xiao RP2040 in bootloader mode.
# There is no monitor step: nothing is printed, so there is nothing to attach to
# (see the README).
runner = "elf2uf2-rs -d"

[env]

[build]
rustflags = [
  # Keep the flash image compact: do not page-align sections.
  "-C",
  "link-arg=--nmagic",
  # The cortex-m-rt linker script.
  "-C",
  "link-arg=-Tlink.x",
  # The `embassy-rp` linker script fragment. It places the second stage
  # bootloader `embassy-rp` supplies into the `BOOT2` region `memory.x` carves
  # out, and is only emitted for the RP2040.
  "-C",
  "link-arg=-Tlink-rp.x",
]

target = "thumbv6m-none-eabi"
