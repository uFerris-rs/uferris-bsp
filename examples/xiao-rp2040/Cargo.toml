[package]
edition = "2024"
name = "xiao-rp2040-examples"
rust-version = "1.88"
version = "0.1.0"
publish = false

[dependencies]
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

embedded-hal = "1.0.0"

# The Xiao RP2040 has no USB-to-UART bridge, so `usb-console` has the BSP bring
# up a USB CDC serial device for the examples to print over.
uferris-bsp = { path = "../..", features = ["xiao-rp2040", "usb-console"] }


[[bin]]
name = "blinky"
path = "src/bin/blinky.rs"


[[bin]]
name = "baseboard_demo"
path = "src/bin/baseboard_demo.rs"

[[bin]]
name = "full_board_demo"
path = "src/bin/full_board_demo.rs"
required-features = ["power-board"]


[features]
power-board = ["uferris-bsp/power-board"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
