[package]
name = "uferris-bsp"
version = "0.1.3"
edition = "2024"
description = "A Board Support Package for the uFerris Learner Board"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uFerris-rs/uferris-bsp"
keywords = ["embedded", "uferris", "xiao", "no_std"]
categories = ["embedded"]
readme = "README.md"
homepage = "https://theembeddedrustacean.com/"
exclude = ["target/debug/*", "assets/*"]

[features]
#! ⚠️ At least one Xiao device feature must be enabled when building the crate.

default = []
## Xiao ESP32-C3 Device Support
xiao-esp32c3 = [
    "esp-hal/esp32c3",
    "static_cell",

]
## Xiao ESP32-C5 Device Support
xiao-esp32c5 = [
    "esp-hal/esp32c5",
    "static_cell",
    "portable-atomic/critical-section",
]

## Xiao ESP32-C6 Device Support
xiao-esp32c6 = [
    "esp-hal/esp32c6",
    "static_cell",
    "portable-atomic/critical-section",
]

## Xiao ESP32-S3 Device Support
xiao-esp32s3 = [
    "esp-hal/esp32s3",
    "static_cell",
]

## Xiao nRF52840 Device Support
xiao-nrf52840 = [
    "dep:embassy-nrf",
    "embassy-nrf/nrf52840",
    "embassy-nrf/rt",
    "embassy-nrf/unstable-pac",
    "dep:cortex-m",
    "cortex-m/critical-section-single-core",
    "static_cell",
]

## Xiao nRF54L15 Device Support
xiao-nrf54l15 = [
    "dep:embassy-nrf",
    "embassy-nrf/nrf54l15-app-s",
    "embassy-nrf/rt",
    "embassy-nrf/unstable-pac",
    "dep:cortex-m",
    "cortex-m/critical-section-single-core",
    "static_cell",
]

## Xiao RP2040 Device Support
xiao-rp2040 = [
    "dep:embassy-rp",
    "embassy-rp/rp2040",
    "embassy-rp/rt",
    "embassy-rp/critical-section-impl",
    "dep:cortex-m",
    "static_cell",
    "portable-atomic/critical-section",
]

## Xiao RP2350 Device Support
xiao-rp2350 = [
    "dep:embassy-rp",
    "embassy-rp/rp235xa",
    "embassy-rp/rt",
    "embassy-rp/critical-section-impl",
    "embassy-rp/imagedef-none",
    "dep:cortex-m",
    "static_cell",
]

## uFerris Megalops Power Board Extension Support
power-board = []

## `async` Support Feature Flag. Enables the `async` board API — the
## `Uferris<.., Async>` mode, whose I2C and ADC operations are `async fn`s. This
## is a pure code gate: the executor and the time driver are the application's
## responsibility, the BSP starts neither. Board adapters opt in one at a time
## by adding an `uferris_init_async`: the Xiao nRF52840, nRF54L15, RP2040 and
## RP2350 have one, and the ESP boards are blocking-only for now.
async = [
    "dep:embedded-hal-async",
    "dep:embassy-embedded-hal",
    "dep:embassy-sync",
    # `embedded_hal_async::digital::Wait` for `Input`, which is what
    # `wait_for_sw5` waits on, lives behind `embassy-nrf`'s `gpiote` feature.
    "embassy-nrf?/gpiote",
]


[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-hal-bus = "0.3.0"
nb = "1.0.0"
bitmask-enum = "2.2.5"
ina219 = "0.2.0"
embedded-sdmmc = "0.9.0"
document-features = "0.2.11"
static_cell = { version = "2.1.1", optional = true }
# Shared `async` bus support, used by the `async` board adapters. Both track the
# versions the embassy HALs already depend on, so Cargo unifies them.
embassy-embedded-hal = { version = "0.6.0", optional = true, default-features = false }
embassy-sync = { version = "0.8.0", optional = true }
# Device HALs
esp-hal = { version = "~1.1", optional = true, features = ["unstable"] }
embassy-rp = { version = "0.10.0", optional = true }
embassy-nrf = { version = "0.11.0", optional = true }
portable-atomic = { version = "1.13.1", optional = true }
cortex-m = { version = "0.7.7", optional = true }


[package.metadata.docs.rs]
features = ["xiao-esp32c3"]
default-target = "riscv32imc-unknown-none-elf"
rustdoc-args = ["--cfg", "docsrs"]
